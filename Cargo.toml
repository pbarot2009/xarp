[package]
name = "xarp"
version = "0.1.1-dev"
edition = "2024"
rust-version = "1.85"
authors = ["Prathmesh S. Barot"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pbarot2009/xarp"
homepage = "https://github.com/pbarot2009/xarp"
documentation = "https://docs.rs/xarp"
description = "A zero-dependency, pure-Rust argument parser with rich 24-color and RGB terminal styling."
readme = "README.md"
keywords = ["cli", "arguments", "styling", "colors", "terminal"]
categories = ["command-line-interface", "development-tools"]
exclude = [
    ".github/",
    ".gitignore"
]

[lib]
name = "xarp"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow acceptable patterns for CLI builder libraries
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"

[dependencies]
