[package]
name = "xarp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, dependency-free CLI styling and argument parser in pure Rust."
repository = "https://github.com/pbarot2009/xarp"
readme = "README.md"
keywords = ["cli", "arguments", "styling", "colors"]
exclude = [
    ".github/"
]
[lib]
name = "xarp"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow acceptable patterns for CLI builder libraries
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"

[dependencies]
